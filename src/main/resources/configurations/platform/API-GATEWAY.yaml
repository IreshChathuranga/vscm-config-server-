server:
  port: 7000
spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: [ GET, POST, PUT, PATCH, DELETE, OPTIONS ]
            allowedHeaders: "*"
      routes:
        - id: customer-service
          uri: lb://CUSTOMER-SERVICE
          predicates: [ Path=/api/v1/customers/** ]
        - id: vehicle-service
          uri: lb://VEHICLE-SERVICE
          predicates: [ Path=/api/v1/vehicles/** ]
        - id: catalog-service
          uri: lb://SERVICE-CATALOG-SERVICE
          predicates: [ Path=/api/v1/services/** ]
        - id: work-order-service
          uri: lb://WORK-ORDER-SERVICE
          predicates: [ Path=/api/v1/work-orders/** ]
        - id: billing-service
          uri: lb://BILLING-SERVICE
          predicates: [ Path=/api/v1/billing/** ]

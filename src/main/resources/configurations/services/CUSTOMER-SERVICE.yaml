server:
  port: 0
spring:
  application:
    name: CUSTOMER-SERVICE
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/db-vscm}
    username: ${CUSTOMER_DB_USER:postgres}
    password: ${CUSTOMER_DB_PASSWORD:psql}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

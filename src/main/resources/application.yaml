server:
  port: 9002
spring:
  application:
    name: CONFIG-SERVER
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: https://github.com/IreshChathuranga/vscm-configuration.git
          default-label: main
          search-paths:
            - configurations
            - configurations/platform
            - configurations/services
          clone-on-start: true
management:
  endpoints:
    web:
      exposure:
        include: health,info

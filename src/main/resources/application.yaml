server:
  port: 9002
spring:
  application:
    name: CONFIG-SERVER
  profiles:
    active: native
  cloud:
    config:
      server:
        git:
            uri: https://github.com/IreshChathuranga/vscm-configuration.git
            search-paths: platform,services
        native:
          search-locations:
            - classpath:/configurations
            - classpath:/configurations/platform
            - classpath:/configurations/services
management:
  endpoints:
    web:
      exposure:
        include: health,info
